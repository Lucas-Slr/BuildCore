<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildCore · API Explorer</title><style>body{font:16px/1.6 system-ui;background:#f5f8f5;color:#173d35;max-width:1100px;margin:40px auto;padding:24px}h1{font-size:2.8rem;letter-spacing:-.04em}a{color:#087f6a}article{background:white;border:1px solid #dbe5dc;border-radius:8px;padding:18px;margin:16px 0}summary{cursor:pointer;font-weight:600}code,pre{font-family:Consolas,monospace}pre{background:#edf2ee;padding:16px;overflow:auto;font-size:13px}button{padding:10px 16px;background:#087f6a;color:white;border:0;border-radius:5px;cursor:pointer}input{padding:10px;width:min(90%,650px);margin:10px}label{display:block}small{display:block;color:#567167}</style></head><body><h1>BuildCore API.</h1><p>Contrat REST version 1 · <a href="/api/v1/openapi.json">Télécharger OpenAPI 3.0.3</a></p><p>Les mutations exigent une session et l’en-tête <code>X-CSRF-Token</code>. Les routes administratives exigent <code>ROLE_ADMIN</code>. Cet explorateur permet d’exécuter les lectures ; les schémas et exemples décrivent les écritures.</p><label>Filtrer les opérations<input id="filter" type="search" placeholder="catalogue, stock, orders…"></label><main id="operations" aria-live="polite">Chargement du contrat…</main><script>
fetch('/api/v1/openapi.json').then(r=>r.json()).then(spec=>{const root=document.getElementById('operations');root.textContent='';for(const [path,methods] of Object.entries(spec.paths)){for(const [method,operation] of Object.entries(methods)){const article=document.createElement('article');const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=method.toUpperCase()+' '+path+' — '+operation.summary;details.append(summary);const description=document.createElement('p');description.textContent=operation.description||'';details.append(description);const pre=document.createElement('pre');pre.textContent=JSON.stringify(operation,null,2);details.append(pre);if(method==='get'&&!path.includes('{')){const button=document.createElement('button');button.textContent='Exécuter GET';button.onclick=async()=>{const response=await fetch(path);const output=document.createElement('pre');output.textContent=response.status+'\n'+JSON.stringify(await response.json(),null,2);details.append(output);};details.append(button);}article.append(details);root.append(article);}}document.getElementById('filter').addEventListener('input',e=>{for(const article of root.children){article.hidden=!article.textContent.toLowerCase().includes(e.target.value.toLowerCase());}});}).catch(()=>{document.getElementById('operations').textContent='Le contrat est momentanément indisponible.';});
</script></body></html>
